apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: django-metrics
  namespace: dev
  labels:
    release: rancher-monitoring
spec:
  selector:
    matchLabels:
      app: django
  namespaceSelector:
    matchNames:
      - dev
  endpoints:
    - port: http
      path: /metrics/
      interval: 15s