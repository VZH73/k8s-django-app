django:
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    cpuUtilization: 60

  image:
    repository: vzh12345/k8s-django-app
    tag: v1
    pullPolicy: IfNotPresent

  env:
    debug: "False"
    allowedHosts: "*"

  probes:
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5

nginx:
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

ingress:
  host: prod.local

postgres:
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"