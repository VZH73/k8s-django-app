name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            vzh12345/k8s-django-app:latest

  deploy-dev:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Deploy to dev via Helm
        run: |
          cd ~/projects/k8s-django-app
          helm upgrade my-app ./django-chart -n dev -f values-dev.yaml
          k3s kubectl rollout restart deployment/my-app-django -n dev
          k3s kubectl rollout status deployment/my-app-django -n dev          