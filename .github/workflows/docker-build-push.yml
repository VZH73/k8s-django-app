name: Build Push and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            vzh12345/k8s-django-app:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Deploy selected environment
        run: |
          cd ~/projects/k8s-django-app

          if [ "${{ github.event_name }}" = "push" ]; then
            ENVIRONMENT="dev"
          else
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          fi

          if [ "$ENVIRONMENT" = "dev" ]; then
            NAMESPACE="dev"
            VALUES_FILE="values-dev.yaml"
          else
            NAMESPACE="prod"
            VALUES_FILE="values-prod.yaml"
          fi

          echo "Deploying to $NAMESPACE using $VALUES_FILE"

          helm upgrade my-app ./django-chart -n $NAMESPACE -f $VALUES_FILE \
            --set django.image.tag=${{ github.sha }} \
            --set django.image.pullPolicy=IfNotPresent

          k3s kubectl rollout status deployment/my-app-django -n $NAMESPACE